[project]
name = "pctsea"
version = "1.0.0"
description = "Proteomics Cell Type Single-cell Enrichment Analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "pymongo>=4.6",
    "umap-learn>=0.5",
    "matplotlib>=3.8",
]

[project.scripts]
pctsea = "pctsea.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pctsea"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ty.environment]
python-version = "3.11"
